version: '3.8'

services:
  pl-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    image: pl-predictor:latest
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - LOG_LEVEL=INFO
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/models" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
